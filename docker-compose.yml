version: '3.8'

services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:ta%23qK%24ugX%3FSKPy9@db.emxpmyotsjbwrgxbtudy.supabase.co:5432/postgres
      - SECRET_KEY=second-brain-secret-key-change-in-production-32chars!
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=10080
      - AI_SERVICE_URL=http://ai-services:8001
    depends_on:
      ai-services:
        condition: service_started

  ai-services:
    build:
      context: ./ai-services
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - ai_models:/root/.cache/huggingface
      - chroma_data:/app/chroma_db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  ai_models:
  chroma_data:
